<document-list></document-list>
<ng-container [ngTemplateOutlet]="documentenApiText"></ng-container>

<ng-template #documentenApiText>
  <div
    class="documenten-api-text-container">
    <cds-text-label
      class="documenten-api-text"
      [skeleton]="isLoading()"
      [helperText]="helperText">
    </cds-text-label>
    <a [href]="this.openZaakUrl" target="_blank">Link naar de zaak in Open Zaak.</a>
  </div>
</ng-template>
