@if (!isLoading()) {
  <div class="other-participant">
    <svg cdsIcon="collaborate" size="32" class="collaborate-icon"></svg>
    <h3>
      {{ otherParticipant() }}
    </h3>
  </div>
}
@if (!hasError()) {
  <berichten-list [messages]="messages()" [isLoading]="isLoading()" [oinNumber]="oinNumber()"></berichten-list>
}
<stuur-bericht (messageSent)="refreshMessages()"></stuur-bericht>
