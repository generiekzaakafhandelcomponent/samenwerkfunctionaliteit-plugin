@if (isLoading()) {

  <div class="notificatie-card skeleton-card">
    @for (item of itemsPerPageArray; track $index) {
      <cds-skeleton-text [maxLineWidth]="600" [minLineWidth]="100" [lines]="6"></cds-skeleton-text>
    }
  </div>
}
@if (!this.isLoading()) {
  <div class="notificatiecard-list">
    @for (input of this.inputs(); track input.notificatieId) {
      <swf-notificatie
        [inputs]="input"
      ></swf-notificatie>
    }
  </div>
}
