<div class="notificatiecard" [class]="getTypeClass(inputs().type)">
  <div class="notificatie-header">
    <h5>
      {{ inputs().type }}
    </h5>
    <span class="notificatie-title">{{ inputs().title }}</span>
  </div>

  <div class="notificatie-meta">
    <span>
      {{ inputs().eventDateTime }}
    </span>
    <span>
      {{ inputs().initiatorNaam }}
    </span>
  </div>

  <div>
    {{ inputs().content }}
  </div>
</div>
