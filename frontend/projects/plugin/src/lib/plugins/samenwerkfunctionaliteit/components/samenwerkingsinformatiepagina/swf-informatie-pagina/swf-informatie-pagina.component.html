<div
  [ngClass]="{
    'refresh-container': true,
  }"
>
  <cds-loading
    [size]="'sm'"
    [isActive]="isLoading()"
    [overlay]="false"
  ></cds-loading>
</div>

<section>
  @if (!isLoading()) {
    <samenwerkingsstatus [samenwerking]="this.samenwerking()"></samenwerkingsstatus>
    <samenwerking [samenwerking]="this.samenwerking()"></samenwerking>
    <!--  <documentenlijst></documentenlijst>-->
  }
  @if (hasError()) {
    <p>{{ this.errorMessage() }}</p>
  }
</section>
