<div [class.sent]="isSender()" class="message-bubble-container">
  <div class="message-bubble">
    <div class="message-content">
      <p class="message-text">{{ message().content }}</p>
      <p class="message-timestamp">{{ message().createdOn | date: 'dd-MM-yyyy, HH:mm' }}</p>
    </div>
  </div>
</div>
