<div class="stuur-bericht">
  <textarea
    cdsTextArea
    class="textarea-field message-body"
    [placeholder]="placeholder"
    [rows]="rows"
    [maxLength]="maxLength"
    [(ngModel)]="message"
  ></textarea>
  <cds-icon-button
    description="Bericht versturen"
    [disabled]="!message.trim()"
    (click)="onClick()"
  >
  <svg
    cdsIcon="send"
    size="32"
    class="cds--btn__icon">
  </svg>
  </cds-icon-button>
</div>
