@if(this.isMissingActieverzoekId())
{
  <cds-notification
    [notificationObj]="{
      type: 'info',
      title: ('stuurBerichtMissingActieverzoekIdTitle' | pluginTranslate: pluginId | async),
      message: ('stuurBerichtMissingActieverzoekIdMessage' | pluginTranslate: pluginId | async),
      showClose: false
    }"
  ></cds-notification>
}
@else
{
  <div class="stuur-bericht">
    <p>{{ 'stuurBerichtTitle' | pluginTranslate: pluginId | async }}</p>
    <textarea
      cdsTextArea
      class="textarea-field message-body"
      [placeholder]="'stuurBerichtPlaceholder' | pluginTranslate: pluginId | async"
      [rows]="rows"
      [maxLength]="maxLength"
      [(ngModel)]="message"
    ></textarea>

    <cds-icon-button
      [description]="'stuurBerichtSendButtonDescription' | pluginTranslate: pluginId | async"
      [disabled]="isSubmitting() || !message.trim()"
      (click)="onClick()"
    >
      <svg
        cdsIcon="send"
        size="32"
        class="cds--btn__icon">
      </svg>
    </cds-icon-button>

    @if (notification()) {
      <cds-notification
        [notificationObj]="{
          type: notification()!.type,
          title: (notification()!.titleKey | pluginTranslate: pluginId | async),
          message: (notification()!.messageKey | pluginTranslate: pluginId | async),
          showClose: true
        }"
        (close)="dismissNotification()"
      ></cds-notification>
    }
  </div>
}
