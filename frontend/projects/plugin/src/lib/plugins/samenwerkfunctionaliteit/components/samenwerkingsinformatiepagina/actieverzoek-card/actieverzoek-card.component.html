<div class="card">
  <h4 class="card-header__header-title">{{ 'Actieverzoek: ' + actieverzoek().title }}</h4>

  <div class="card-body">
    <div class="row">
      <cds-label>Status</cds-label>
      <div class="value">{{ statusText | translate }}</div>
    </div>


    <div class="row">
      <cds-label>Datum</cds-label>
      <div class="value">{{ actieverzoek().createdOn | date: "dd-MM-yyyy" }}</div>
    </div>

    <div class="row">
      <cds-label>Verzonden door</cds-label>

      <div class="value">{{ capitalize(actieverzoek().senderName) }}</div>
    </div>

    <div class="row">
      <cds-label>Productcode</cds-label>
      <div class="value">{{ actieverzoek().productId }}</div>
    </div>

    <div class="row">
      <cds-label>Omschrijving</cds-label>
      <div class="value description">{{ actieverzoek().description }}</div>
    </div>
  </div>
</div>
