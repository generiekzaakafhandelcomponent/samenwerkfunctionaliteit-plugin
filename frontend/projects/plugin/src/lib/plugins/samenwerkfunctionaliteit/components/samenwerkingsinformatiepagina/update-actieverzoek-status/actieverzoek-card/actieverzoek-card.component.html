<div class="card">
  <div class="card-header">
    <h3 class="title">{{ 'Actieverzoek: ' + actieverzoek().title }}</h3>
  </div>

  <div class="card-body">
    <div class="row">
      <div class="label">Status</div>
      <div class="value">{{ actieverzoek().status }}</div>
    </div>


    <div class="row">
      <div class="label">Date</div>
      <div class="value">{{ actieverzoek().createdOn | date }}</div>
    </div>

    <div class="row">
      <div class="label">Sent by</div>
      <div class="value">{{ actieverzoek().senderName }}</div>
    </div>

    <div class="row">
      <div class="label">Product code</div>
      <div class="value">{{ actieverzoek().productId }}</div>
    </div>

    <div class="row">
      <div class="label">Description</div>
      <div class="value description">{{ actieverzoek().description }}</div>
    </div>
  </div>
</div>
