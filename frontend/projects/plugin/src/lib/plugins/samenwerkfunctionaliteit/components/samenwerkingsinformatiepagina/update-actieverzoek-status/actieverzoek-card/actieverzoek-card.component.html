<div class="card">
  <h4 class="card-header__header-title">{{ 'Actieverzoek: ' + actieverzoek().title }}</h4>

  <div class="card-body">
    <div class="row">
      <div class="label">Status</div>
      <div class="value">{{ actieverzoek().status }}</div>
    </div>


    <div class="row">
      <div class="label">Datum</div>
      <div class="value">{{ actieverzoek().createdOn | date }}</div>
    </div>

    <div class="row">
      <div class="label">Verzonden door</div>
      <div class="value">{{ actieverzoek().senderName }}</div>
    </div>

    <div class="row">
      <div class="label">Productcode</div>
      <div class="value">{{ actieverzoek().productId }}</div>
    </div>

    <div class="row">
      <div class="label">Omschrijving</div>
      <div class="value description">{{ actieverzoek().description }}</div>
    </div>
  </div>
</div>
