<cds-table-container>
  <cds-table-toolbar [model]="model()" #toolbar>
    <cds-table-toolbar-actions>
      <button cdsButton="primary" (click)="deleteDocument()">
        {{ 'swf.error.noSamenwerkingId.delete' | translate }}
        <svg cdsIcon="delete" size="16" class="cds--btn__icon"></svg>
      </button>
      <button cdsButton="primary" (click)="downloadDocument()">
        Download
        <svg cdsIcon="download" size="16" class="cds--btn__icon"></svg>
      </button>
    </cds-table-toolbar-actions>
    <cds-table-toolbar-content *ngIf="!toolbar.selected">
      <cds-table-toolbar-search
        [expandable]="true"
        (valueChange)="filterFileNames($event)"
        (clear)="searchValue.set('')">
      </cds-table-toolbar-search>
      <button cdsButton="primary" size="sm" (click)="uploadDocument()" [disabled]="isUploading()">
        Upload document
        <svg cdsIcon="add" size="20" class="cds--btn__icon"></svg>
      </button>
    </cds-table-toolbar-content>
  </cds-table-toolbar>

  <cds-table
    [model]="model()"
    [showSelectionColumn]="showSelectionColumn"
    [skeleton]="isSkeleton()"
    [striped]="striped"
  >
  </cds-table>
  <cds-pagination [model]="model()" (selectPage)="selectPage($event)"></cds-pagination>
</cds-table-container>

<cds-placeholder></cds-placeholder>
